      <path d="M 36 -74 C 46 -68, 52 -58, 50 -46" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.75"/>
    </g>
    <ellipse cx="50" cy="-44" rx="14" ry="11" fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.3" stroke-opacity="0.75"/>
  </g>

  <!-- figure A: foreground, left, walking pose (slight lean) -->
  <g transform="translate(332 358) rotate(3)">
    <path d="M -68 190 L -76 120 C -78 88, -66 58, -40 34 C -26 22, -12 16, 2 14
             C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 72 190 Z"
          fill="url(#pbSkin)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 2 14 C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 74 190"
          fill="none" stroke="url(#pbRim)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 -8 C -18 8, -19 22, -17 36 L 15 36 C 17 22, 16 8, 12 -8 Z"
