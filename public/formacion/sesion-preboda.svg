<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="pbGlow" cx="52%" cy="58%" r="58%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.17"/>
      <stop offset="48%" stop-color="#d4af37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbFigureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="pbRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="pbSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbSunCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4cf63"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- ambient glow behind the couple -->
  <ellipse cx="470" cy="340" rx="290" ry="260" fill="url(#pbGlow)"/>

  <!-- rule-of-thirds guide lines -->
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>

  <!-- radiating composition guide lines toward the low horizon -->
  <g stroke="#d4af37" stroke-opacity="0.18" stroke-width="1" fill="none">
    <line x1="70" y1="90" x2="450" y2="505"/>
    <line x1="730" y1="90" x2="450" y2="505"/>
    <line x1="70" y1="530" x2="450" y2="505"/>
    <line x1="730" y1="530" x2="450" y2="505"/>
  </g>

  <!-- viewfinder corner brackets -->
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>

  <!-- exposure tick marks along the frame edges -->
  <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="266.7" y1="70" x2="266.7" y2="82"/>
    <line x1="533.3" y1="70" x2="533.3" y2="82"/>
    <line x1="266.7" y1="518" x2="266.7" y2="530"/>
    <line x1="533.3" y1="518" x2="533.3" y2="530"/>
  </g>

  <!-- thin horizon line -->
  <line x1="150" y1="530" x2="650" y2="530" stroke="#d4af37" stroke-opacity="0.16" stroke-width="1"/>

  <!-- golden-hour sun, low in frame, between the two figures -->
  <g>
    <circle cx="450" cy="505" r="105" fill="url(#pbSunGlow)"/>
    <g stroke="#d4af37" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round">
      <line x1="450" y1="452" x2="450" y2="404"/>
      <line x1="472" y1="472" x2="508" y2="436"/>
      <line x1="428" y1="472" x2="392" y2="436"/>
      <line x1="492" y1="497" x2="538" y2="480"/>
      <line x1="408" y1="497" x2="362" y2="480"/>
      <line x1="498" y1="514" x2="546" y2="518"/>
      <line x1="402" y1="514" x2="354" y2="518"/>
      <line x1="486" y1="530" x2="522" y2="552"/>
      <line x1="414" y1="530" x2="378" y2="552"/>
    </g>
    <circle cx="450" cy="505" r="22" fill="url(#pbSunCore)" opacity="0.85"/>
  </g>

  <!-- figure B: further partner, standing to the right, slightly behind -->
  <g>
    <path d="M 690 330
             Q 690 300 650 292
             L 610 286
             Q 578 282 538 278
             Q 490 284 486 328
             C 466 372, 466 448, 506 500
             Q 562 520 618 516
             Q 672 514 696 480
             Q 718 408 690 330 Z"
          fill="url(#pbFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.85" stroke-linejoin="round"/>
    <path d="M 650 292 Q 690 300 690 330 C 718 380, 718 448, 696 480"
          fill="none" stroke="url(#pbRim)" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="600" cy="240" rx="34" ry="42" fill="url(#pbFigureFill)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85" transform="rotate(6 600 240)"/>
    <path d="M 618 206 C 630 218, 632 254, 616 270" fill="none" stroke="url(#pbRim)" stroke-width="2" stroke-linecap="round" transform="rotate(6 600 240)"/>
  </g>

  <!-- figure A: nearer partner, standing to the left, in front, close together -->
  <g>
    <path d="M 300 320
             Q 300 282 352 270
             L 404 262
             Q 446 258 496 252
             Q 556 260 562 316
             C 590 374, 590 468, 538 536
             Q 466 562 394 558
             Q 324 556 292 512
             Q 264 422 300 320 Z"
          fill="url(#pbFigureFill)" stroke="#d4af37" stroke-width="2" stroke-opacity="0.92" stroke-linejoin="round"/>
    <path d="M 496 252 Q 556 260 562 316 C 590 374, 590 468, 538 536"
          fill="none" stroke="url(#pbRim)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 344 274 L 388 328 L 428 264" fill="none" stroke="#f8f5ed" stroke-width="1.1" stroke-opacity="0.24"/>
    <ellipse cx="388" cy="196" rx="40" ry="50" fill="url(#pbFigureFill)" stroke="#d4af37" stroke-width="1.9" stroke-opacity="0.92" transform="rotate(-6 388 196)"/>
    <path d="M 414 160 C 428 174, 430 216, 412 234" fill="none" stroke="url(#pbRim)" stroke-width="2.4" stroke-linecap="round" transform="rotate(-6 388 196)"/>
  </g>

  <!-- faint scattered texture / atmospheric dust motes -->
  <g fill="#f4cf63">
    <circle cx="130" cy="120" r="1.8" opacity="0.28"/>
    <circle cx="712" cy="150" r="1.6" opacity="0.22"/>
    <circle cx="690" cy="220" r="1.4" opacity="0.2"/>
    <circle cx="110" cy="380" r="1.6" opacity="0.24"/>
  </g>

  <!-- thin frame line, full bleed -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- exposure meter ladder, upper right -->
  <g stroke="#f8f5ed" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="628" y1="130" x2="628" y2="144"/>
    <line x1="642" y1="130" x2="642" y2="144"/>
    <line x1="656" y1="126" x2="656" y2="148"/>
    <line x1="670" y1="130" x2="670" y2="144"/>
    <line x1="684" y1="130" x2="684" y2="144"/>
  </g>
  <circle cx="656" cy="137" r="2" fill="#f4cf63" opacity="0.65"/>
</svg>
