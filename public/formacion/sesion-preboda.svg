    <path d="M -38 -76 C -42 -46, -35 -20, -14 -6 C -2 2, 2 2, 14 -6 C 35 -20, 42 -46, 38 -76
             C 35 -104, 18 -120, 0 -120 C -18 -120, -35 -104, -38 -76 Z"
          fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85"/>
    <path d="M -28 -66 Q -18 -72 -8 -68" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M 8 -68 Q 18 -72 28 -66" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -27 -56 Q -18 -51 -6 -55" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M 6 -55 Q 18 -51 27 -56" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M -12 -23 Q 0 -18 12 -23" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.65"/>
    <path d="M -38 -74 C -48 -110, -28 -144, 8 -148 C 42 -152, 60 -126, 54 -94
