<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="pbGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f5ed" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f4cf63" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="pbSkin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211d16"/>
      <stop offset="100%" stop-color="#0b0a08"/>
    </linearGradient>
    <linearGradient id="pbHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
    <linearGradient id="pbRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pbGlow)"/>
  <!-- low golden-hour sun -->
  <circle cx="560" cy="420" r="90" fill="url(#pbSun)"/>
  <g stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3">
    <line x1="560" y1="300" x2="560" y2="330"/>
    <line x1="440" y1="420" x2="470" y2="420"/>
    <line x1="480" y1="340" x2="500" y2="360"/>
    <line x1="640" y1="340" x2="620" y2="360"/>
  </g>
  <line x1="60" y1="470" x2="740" y2="470" stroke="#d4af37" stroke-opacity="0.18" stroke-width="1"/>

  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- figure B: behind, slightly right -->
  <g transform="translate(478 372) scale(0.85) rotate(-5)" opacity="0.9">
    <path d="M -66 190 L -74 122 C -76 90, -64 60, -38 36 C -24 24, -10 18, 4 16
