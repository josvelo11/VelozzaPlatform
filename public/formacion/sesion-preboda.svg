<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="pbGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f5ed" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f4cf63" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="pbSkin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211d16"/>
      <stop offset="100%" stop-color="#0b0a08"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pbGlow)"/>

  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>

  <!-- low golden-hour sun sitting on the horizon, off to the right -->
  <circle cx="560" cy="420" r="90" fill="url(#pbSun)"/>
  <g stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3">
    <line x1="560" y1="300" x2="560" y2="330"/>
    <line x1="440" y1="420" x2="470" y2="420"/>
    <line x1="480" y1="340" x2="500" y2="360"/>
    <line x1="640" y1="340" x2="620" y2="360"/>
  </g>
  <!-- horizon line: the frame reads as a landscape, not a portrait crop -->
  <line x1="60" y1="430" x2="740" y2="430" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1"/>
  <!-- faint reflected glints along the ground -->
  <g stroke="#f4cf63" stroke-opacity="0.18" stroke-width="1">
    <line x1="500" y1="442" x2="620" y2="442"/>
    <line x1="520" y1="456" x2="600" y2="456"/>
  </g>

  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- faint scattered texture dots, sparse -->
  <g fill="#f4cf63">
    <circle cx="110" cy="90" r="1.6" opacity="0.22"/>
    <circle cx="700" cy="100" r="1.6" opacity="0.2"/>
  </g>

  <!-- motion / footprint trail, fading back to the left -->
  <g fill="#d4af37">
    <ellipse cx="238" cy="431" rx="7" ry="2.6" opacity="0.22" transform="rotate(-8 238 431)"/>
    <ellipse cx="213" cy="433" rx="7" ry="2.6" opacity="0.14" transform="rotate(-8 213 433)"/>
    <ellipse cx="190" cy="435" rx="7" ry="2.6" opacity="0.08" transform="rotate(-8 190 435)"/>
  </g>

  <!-- two small, distant full-body silhouettes, walking hand-in-hand toward the sun -->
  <!-- figure B: slightly behind, smaller, faded -->
  <g transform="translate(352 424) scale(-0.85 0.85)" opacity="0.82">
    <circle cx="0" cy="-134" r="12" fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.3" stroke-opacity="0.75"/>
    <line x1="0" y1="-121" x2="2" y2="-114" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M -14 -112 C -19 -96, -17 -76, -10 -58 L 8 -58 C 15 -76, 17 -96, 12 -112
             C 6 -118, -8 -118, -14 -112 Z"
          fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.8" stroke-linejoin="round"/>
    <path d="M 6 -58 C 12 -44, 18 -28, 26 -8 L 34 -4 C 26 -22, 18 -40, 10 -56 Z"
          fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.75" stroke-linejoin="round"/>
    <path d="M -8 -58 C -14 -44, -20 -28, -26 -10 L -34 -6 C -26 -24, -18 -42, -10 -56 Z"
          fill="url(#pbSkin2)" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.75" stroke-linejoin="round"/>
    <path d="M 10 -108 Q 24 -100 30 -86" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- figure A: foreground, closer, leading -->
  <g transform="translate(272 428)">
    <circle cx="0" cy="-134" r="12" fill="url(#pbSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85"/>
    <line x1="0" y1="-121" x2="2" y2="-114" stroke="#d4af37" stroke-width="1.3" stroke-opacity="0.7"/>
    <path d="M -14 -112 C -19 -96, -17 -76, -10 -58 L 8 -58 C 15 -76, 17 -96, 12 -112
             C 6 -118, -8 -118, -14 -112 Z"
          fill="url(#pbSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 12 -112 C 17 -96, 15 -76, 8 -58" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M 6 -58 C 12 -44, 18 -28, 26 -8 L 34 -4 C 26 -22, 18 -40, 10 -56 Z"
          fill="url(#pbSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linejoin="round"/>
    <path d="M -8 -58 C -14 -44, -20 -28, -26 -10 L -34 -6 C -26 -24, -18 -42, -10 -56 Z"
          fill="url(#pbSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linejoin="round"/>
    <path d="M 10 -108 Q 24 -100 30 -86" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-opacity="0.85" stroke-linecap="round"/>
  </g>

  <!-- joined hands accent, sealing the two figures together -->
  <line x1="302" y1="342" x2="324" y2="351" stroke="#f4cf63" stroke-width="2.2" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="313" cy="346" r="2.4" fill="#f8f5ed" opacity="0.85"/>
</svg>
