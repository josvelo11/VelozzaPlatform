          fill="url(#pbHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -38 -74 C -52 -118, -30 -160, 10 -164 C 50 -168, 80 -138, 70 -96
               C 66 -68, 60 -28, 68 20" stroke="#d4af37" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M -32 -86 C -46 -82, -56 -62, -52 -34 C -49 -10, -54 24, -46 60"
            stroke="#d4af37" stroke-width="2.2" stroke-opacity="0.85"/>
      <path d="M -22 -116 C -8 -152, 22 -162, 46 -146" stroke="#f4cf63" stroke-width="1.5" stroke-opacity="0.65"/>
