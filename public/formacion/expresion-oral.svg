<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4cf63"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f4cf63"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- ambient glow behind the bubble -->
  <circle cx="330" cy="270" r="260" fill="url(#glow)"/>

  <!-- faint scattered texture dots -->
  <g fill="#f4cf63">
    <circle cx="120" cy="90" r="2" opacity="0.35"/>
    <circle cx="700" cy="120" r="1.6" opacity="0.3"/>
    <circle cx="660" cy="480" r="2.2" opacity="0.25"/>
    <circle cx="90" cy="480" r="1.6" opacity="0.3"/>
    <circle cx="740" cy="330" r="1.8" opacity="0.3"/>
    <circle cx="60" cy="260" r="1.4" opacity="0.25"/>
  </g>

  <!-- radiating sound-wave arcs, opening rightward from the bubble's edge -->
  <g fill="none" stroke="#d4af37">
    <path d="M 475.96 231.42 A 60 60 0 0 1 475.96 308.58" stroke-width="3" opacity="0.85"/>
    <path d="M 514.26 199.27 A 110 110 0 0 1 514.26 340.73" stroke-width="2.6" opacity="0.62"/>
    <path d="M 552.56 167.12 A 160 160 0 0 1 552.56 372.88" stroke-width="2.2" opacity="0.42"/>
    <path d="M 590.86 134.97 A 210 210 0 0 1 590.86 405.03" stroke-width="1.8" opacity="0.26"/>
    <path d="M 629.16 102.82 A 260 260 0 0 1 629.16 437.18" stroke-width="1.4" opacity="0.14"/>
  </g>

  <!-- speech bubble silhouette -->
  <path d="M 180 160
           Q 140 160 140 200
           L 140 340
           Q 140 380 180 380
           L 232 380
           L 190 452
           L 292 380
           L 390 380
           Q 430 380 430 340
           L 430 200
           Q 430 160 390 160
           Z"
        fill="#0b0b0b" fill-opacity="0.001" stroke="url(#goldLine)" stroke-width="3"/>

  <!-- subtle inner fill for depth -->
  <path d="M 180 160
           Q 140 160 140 200
           L 140 340
           Q 140 380 180 380
           L 232 380
           L 190 452
           L 292 380
           L 390 380
           Q 430 380 430 340
           L 430 200
           Q 430 160 390 160
           Z"
        fill="#d4af37" fill-opacity="0.05"/>

  <!-- three minimal geometric marks inside the bubble, standing in for rhythm/voice -->
  <g fill="#f8f5ed">
    <circle cx="235" cy="268" r="7" opacity="0.9"/>
    <circle cx="285" cy="268" r="7" opacity="0.65"/>
    <circle cx="335" cy="268" r="7" opacity="0.4"/>
  </g>

  <!-- small equalizer / voice-rhythm accent, bottom left -->
  <g fill="url(#barGrad)">
    <rect x="150" y="470" width="7" height="26" rx="3" opacity="0.55"/>
    <rect x="164" y="452" width="7" height="44" rx="3" opacity="0.7"/>
    <rect x="178" y="460" width="7" height="36" rx="3" opacity="0.6"/>
    <rect x="192" y="438" width="7" height="58" rx="3" opacity="0.85"/>
    <rect x="206" y="466" width="7" height="30" rx="3" opacity="0.5"/>
    <rect x="220" y="448" width="7" height="48" rx="3" opacity="0.75"/>
  </g>

  <!-- thin baseline ground line -->
  <line x1="140" y1="520" x2="430" y2="520" stroke="#d4af37" stroke-width="1" opacity="0.2"/>
</svg>
