<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bdGlow" cx="46%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#d4af37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdFigureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="bdRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bdVeilFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f5ed" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f8f5ed" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="bdClockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- ambient glow behind the bride -->
  <ellipse cx="430" cy="320" rx="270" ry="270" fill="url(#bdGlow)"/>

  <!-- rule-of-thirds guide lines -->
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>

  <!-- radiating composition guide lines -->
  <g stroke="#d4af37" stroke-opacity="0.2" stroke-width="1" fill="none">
    <line x1="70" y1="80" x2="420" y2="175"/>
    <line x1="730" y1="100" x2="480" y2="200"/>
    <line x1="70" y1="530" x2="360" y2="440"/>
    <line x1="730" y1="530" x2="560" y2="470"/>
  </g>

  <!-- viewfinder corner brackets -->
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>

  <!-- exposure tick marks along the frame edges -->
  <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="266.7" y1="70" x2="266.7" y2="82"/>
    <line x1="533.3" y1="70" x2="533.3" y2="82"/>
    <line x1="266.7" y1="518" x2="266.7" y2="530"/>
    <line x1="533.3" y1="518" x2="533.3" y2="530"/>
  </g>

  <!-- flowing veil trailing from the head down to the lower-left -->
  <g>
    <path d="M 410 150
             C 338 190 276 258 256 348
             C 242 416 238 476 258 528
             C 300 496 330 438 346 378
             C 362 318 382 258 412 200 Z"
          fill="url(#bdVeilFill)" stroke="#f8f5ed" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 398 162 C 350 210 312 278 300 356 C 293 412 296 462 308 502"
          fill="none" stroke="#f8f5ed" stroke-width="1" stroke-opacity="0.22"/>
    <path d="M 406 156 C 366 198 336 254 322 320"
          fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.28"/>
  </g>

  <!-- bride silhouette: 3/4 turn bust with bridal neckline -->
  <g>
    <path d="M 350 300
             Q 350 266 398 256
             L 448 248
             Q 488 244 536 238
             Q 594 246 598 298
             C 624 352, 624 442, 576 508
             Q 508 532 440 528
             Q 374 526 344 484
             Q 318 400 350 300 Z"
          fill="url(#bdFigureFill)" stroke="#d4af37" stroke-width="1.9" stroke-opacity="0.9" stroke-linejoin="round"/>

    <!-- rim light along the right/back edge -->
    <path d="M 536 238 Q 594 246 598 298 C 624 352, 624 442, 576 508"
          fill="none" stroke="url(#bdRim)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sweetheart neckline hint -->
    <path d="M 392 260 L 440 316 L 484 252" fill="none" stroke="#f8f5ed" stroke-width="1.1" stroke-opacity="0.28"/>

    <!-- neck -->
    <path d="M 416 256 L 424 222 L 458 218 L 468 250 Z" fill="url(#bdFigureFill)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.75"/>

    <!-- head -->
    <ellipse cx="440" cy="178" rx="42" ry="52" fill="url(#bdFigureFill)" stroke="#d4af37" stroke-width="1.9" stroke-opacity="0.9" transform="rotate(-7 440 178)"/>
    <path d="M 466 144 C 480 158, 482 200, 464 218" fill="none" stroke="url(#bdRim)" stroke-width="2.5" stroke-linecap="round" transform="rotate(-7 440 178)"/>

    <!-- crown veil comb line at the head -->
    <path d="M 402 152 Q 440 132 480 152" fill="none" stroke="#f8f5ed" stroke-width="1.2" stroke-opacity="0.32"/>
  </g>

  <!-- clock accent: wedding-day timeline motif, lower-right -->
  <g transform="translate(650 480)" opacity="0.92">
    <circle cx="0" cy="0" r="52" fill="url(#bdClockGlow)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="1.4"/>
    <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.4">
      <line x1="0" y1="-40" x2="0" y2="-33"/>
      <line x1="0" y1="40" x2="0" y2="33"/>
      <line x1="-40" y1="0" x2="-33" y2="0"/>
      <line x1="40" y1="0" x2="33" y2="0"/>
    </g>
    <g stroke="#d4af37" stroke-opacity="0.3" stroke-width="1">
      <line x1="-28.3" y1="-28.3" x2="-23.3" y2="-23.3"/>
      <line x1="28.3" y1="-28.3" x2="23.3" y2="-23.3"/>
      <line x1="-28.3" y1="28.3" x2="-23.3" y2="23.3"/>
      <line x1="28.3" y1="28.3" x2="23.3" y2="23.3"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="10" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.2" fill="#f4cf63"/>
  </g>

  <!-- day-of timeline ribbon along the base -->
  <g stroke="#f8f5ed" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="270" y1="558" x2="270" y2="568"/>
    <line x1="320" y1="558" x2="320" y2="568"/>
    <line x1="370" y1="554" x2="370" y2="572"/>
    <line x1="420" y1="558" x2="420" y2="568"/>
    <line x1="470" y1="558" x2="470" y2="568"/>
  </g>
  <line x1="260" y1="563" x2="480" y2="563" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="370" cy="563" r="2.4" fill="#f4cf63" opacity="0.75"/>

  <!-- faint scattered texture dots -->
  <g fill="#f4cf63">
    <circle cx="700" cy="140" r="1.6" opacity="0.24"/>
    <circle cx="120" cy="480" r="1.6" opacity="0.2"/>
    <circle cx="150" cy="100" r="1.4" opacity="0.2"/>
  </g>

  <!-- thin frame line, full bleed -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>
</svg>
