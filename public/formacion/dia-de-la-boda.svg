<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="bdGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="bdHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
    <linearGradient id="bdRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bdVeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f5ed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f8f5ed" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="310" rx="270" ry="260" fill="url(#bdGlow)"/>
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <g transform="translate(390 340)">
    <!-- veil: translucent shape trailing from the crown down past the frame, drawn behind the figure -->
    <path d="M -10 -150 C -60 -120, -84 -50, -78 40 C -74 110, -60 170, -40 200
             C -56 150, -60 90, -54 30 C -48 -40, -30 -100, 6 -140 Z"
          fill="url(#bdVeil)" stroke="#f8f5ed" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 8 -148 C 44 -114, 62 -50, 56 40 C 52 108, 44 164, 30 196" fill="none" stroke="#f8f5ed" stroke-width="1" stroke-opacity="0.35"/>

    <!-- shoulders/torso -->
    <path d="M -68 190 L -76 120 C -78 88, -66 58, -40 34 C -26 22, -12 16, 2 14
             C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 72 190 Z"
          fill="url(#bdSkin)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 2 14 C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 74 190"
          fill="none" stroke="url(#bdRim)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 -8 C -18 8, -19 22, -17 36 L 15 36 C 17 22, 16 8, 12 -8 Z"
          fill="url(#bdSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M -38 -78 C -42 -48, -35 -22, -14 -8 C -2 0, 2 0, 14 -8 C 35 -22, 42 -48, 38 -78
             C 35 -106, 18 -122, 0 -122 C -18 -122, -35 -106, -38 -78 Z"
          fill="url(#bdSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9"/>
    <path d="M -28 -68 Q -18 -74 -8 -70" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 8 -70 Q 18 -74 28 -68" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M -27 -58 Q -18 -53 -6 -57" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 6 -57 Q 18 -53 27 -58" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -12 -25 Q 0 -20 12 -25" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -14 -8 C -2 0, 2 0, 14 -8" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3"/>
    <!-- hair: updo (fits under a veil/tiara) -->
    <path d="M -42 -76 C -56 -118, -30 -156, 10 -160 C 50 -164, 76 -140, 76 -106
             C 74 -122, 68 -136, 56 -144 C 62 -128, 60 -112, 50 -102
             C 46 -122, 34 -134, 16 -136 C -4 -138, -22 -122, -30 -100
             C -26 -122, -32 -138, -42 -76 Z"
          fill="url(#bdHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -38 -74 C -52 -114, -30 -154, 10 -158 C 50 -162, 78 -138, 78 -104" stroke="#d4af37" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M -30 -88 C -38 -116, -18 -138, 12 -142" stroke="#f4cf63" stroke-width="1.6" stroke-opacity="0.7"/>
      <path d="M 42 -78 C 56 -86, 68 -98, 70 -112" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.8"/>
    </g>
    <!-- delicate tiara arc across the forehead -->
    <path d="M -26 -92 Q 0 -104 26 -92" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-opacity="0.85"/>
    <circle cx="0" cy="-101" r="2.5" fill="#f4cf63"/>
    <circle cx="-13" cy="-97" r="1.6" fill="#f4cf63" opacity="0.8"/>
    <circle cx="13" cy="-97" r="1.6" fill="#f4cf63" opacity="0.8"/>
  </g>

  <!-- clock accent, lower-right (día-de-la-boda = wedding-day schedule) -->
  <g transform="translate(660 470)" opacity="0.9">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="2.4" fill="#f4cf63"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="8" stroke="#d4af37" stroke-width="1.6" stroke-linecap="round"/>
    <g stroke="#d4af37" stroke-width="1" stroke-opacity="0.5">
      <line x1="0" y1="-34" x2="0" y2="-29"/>
      <line x1="0" y1="34" x2="0" y2="29"/>
      <line x1="-34" y1="0" x2="-29" y2="0"/>
      <line x1="34" y1="0" x2="29" y2="0"/>
    </g>
  </g>
  <!-- small timeline tick ribbon -->
  <g transform="translate(140 500)" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="0" y1="0" x2="120" y2="0"/>
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="40" y1="-5" x2="40" y2="5"/>
    <line x1="80" y1="-5" x2="80" y2="5"/>
    <line x1="120" y1="-5" x2="120" y2="5"/>
  </g>
</svg>
