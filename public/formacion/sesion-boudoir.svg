<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="sbGlow" cx="52%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="sbHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
    <linearGradient id="sbRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sbFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="310" rx="290" ry="270" fill="url(#sbGlow)"/>
  <g stroke="#d4af37" stroke-opacity="0.12" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- figure: relaxed, one shoulder softly dropped -->
  <g transform="translate(388 350)">
    <!-- flowing fabric ribbon trailing from the shoulder, drawn first (sits behind the body edge) -->
    <path d="M 46 46 C 90 66, 128 108, 138 164 C 146 206, 130 248, 96 268
             C 122 240, 130 200, 116 162 C 104 128, 74 96, 40 76 Z"
          fill="url(#sbFabric)" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 50 50 C 92 72, 122 112, 130 162" fill="none" stroke="#f4cf63" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- shoulders/torso, one side dropped lower and softer -->
    <path d="M -66 190 L -74 122 C -76 90, -64 60, -38 36 C -24 24, -10 18, 4 16
             C 20 20, 34 30, 44 46 C 58 68, 62 96, 56 128 L 50 190 Z"
          fill="url(#sbSkin)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 4 16 C 20 20, 34 30, 44 46 C 58 68, 62 96, 56 128 L 52 180"
          fill="none" stroke="url(#sbRim)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 -6 C -18 10, -19 24, -17 38 L 15 38 C 17 24, 16 10, 12 -6 Z"
          fill="url(#sbSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M -38 -76 C -42 -46, -35 -20, -14 -6 C -2 2, 2 2, 14 -6 C 35 -20, 42 -46, 38 -76
             C 35 -104, 18 -120, 0 -120 C -18 -120, -35 -104, -38 -76 Z"
          fill="url(#sbSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9"/>
    <path d="M -28 -66 Q -18 -72 -8 -68" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 8 -68 Q 18 -72 28 -66" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M -27 -56 Q -18 -51 -6 -55" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 6 -55 Q 18 -51 27 -56" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -12 -23 Q 0 -18 12 -23" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -14 -6 C -2 2, 2 2, 14 -6" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3"/>
    <!-- hair: loose waves -->
    <path d="M -42 -74 C -58 -120, -32 -164, 10 -168 C 54 -172, 84 -138, 72 -92
             C 68 -64, 62 -24, 70 24
             C 56 -26, 50 -66, 54 -102 C 44 -82, 30 -68, 8 -66
             C 26 -88, 30 -122, 12 -148 C -8 -166, -32 -156, -44 -130
             C -40 -102, -46 -68, -52 -32
             C -56 -68, -54 -102, -42 -74 Z"
          fill="url(#sbHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -38 -72 C -52 -116, -30 -158, 10 -162 C 50 -166, 80 -136, 70 -94
               C 66 -66, 60 -26, 68 22" stroke="#d4af37" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M -32 -84 C -46 -80, -56 -60, -52 -32 C -49 -8, -54 26, -46 62"
            stroke="#d4af37" stroke-width="2.2" stroke-opacity="0.85"/>
      <path d="M -22 -114 C -8 -150, 22 -160, 46 -144" stroke="#f4cf63" stroke-width="1.5" stroke-opacity="0.65"/>
    </g>
  </g>

  <!-- soft unticked focus ring — gentler than the aperture motif used elsewhere -->
  <g transform="translate(388 300)" opacity="0.6">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#f4cf63" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <g transform="translate(140 470)" opacity="0.85">
    <circle cx="0" cy="0" r="34" fill="url(#sbFabric)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>
