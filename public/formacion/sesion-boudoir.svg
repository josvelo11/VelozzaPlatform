<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="sbGlow" cx="50%" cy="54%" r="58%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#d4af37" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbFigureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="sbRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f8f5ed" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sbFabricFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sbFabricRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sbAccentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- warm, soft ambient glow, larger and gentler than the other icons -->
  <ellipse cx="440" cy="330" rx="310" ry="290" fill="url(#sbGlow)"/>

  <!-- rule-of-thirds guide lines, softened -->
  <g stroke="#d4af37" stroke-opacity="0.11" stroke-width="1">
    <line x1="266.7" y1="66" x2="266.7" y2="546"/>
    <line x1="533.3" y1="66" x2="533.3" y2="546"/>
    <line x1="86" y1="206" x2="714" y2="206"/>
    <line x1="86" y1="398" x2="714" y2="398"/>
  </g>

  <!-- viewfinder corner brackets -->
  <g stroke="#d4af37" stroke-width="2.4" fill="none" stroke-linecap="square" stroke-opacity="0.6">
    <path d="M 72 128 L 72 66 L 132 66"/>
    <path d="M 668 66 L 728 66 L 728 128"/>
    <path d="M 728 472 L 728 534 L 668 534"/>
    <path d="M 132 534 L 72 534 L 72 472"/>
  </g>

  <!-- exposure ticks -->
  <g stroke="#d4af37" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="266.7" y1="66" x2="266.7" y2="78"/>
    <line x1="533.3" y1="66" x2="533.3" y2="78"/>
    <line x1="266.7" y1="534" x2="266.7" y2="546"/>
    <line x1="533.3" y1="534" x2="533.3" y2="546"/>
  </g>

  <!-- relaxed, elegant silhouette: one shoulder softly dropped -->
  <g>
    <path d="M 350 320
             Q 348 278 392 264
             L 440 254
             Q 480 248 520 258
             Q 556 268 558 316
             C 566 372, 552 460, 500 520
             Q 440 548 380 538
             Q 330 528 314 484
             Q 296 400 350 320 Z"
          fill="url(#sbFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.85" stroke-linejoin="round"/>

    <!-- rim light along the back/right edge -->
    <path d="M 520 258 Q 556 268 558 316 C 566 372, 552 460, 500 520"
          fill="none" stroke="url(#sbRim)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M 396 268 L 402 232 L 438 230 L 446 264 Z" fill="url(#sbFigureFill)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>

    <!-- head, softly tilted down -->
    <ellipse cx="422" cy="190" rx="42" ry="52" fill="url(#sbFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.85" transform="rotate(-6 422 190)"/>
    <path d="M 448 158 C 462 172, 462 210, 444 228" fill="none" stroke="url(#sbRim)" stroke-width="2.4" stroke-linecap="round" transform="rotate(-6 422 190)"/>
  </g>

  <!-- flowing draped-fabric line, trailing from the shoulder toward the lower corner -->
  <path d="M 536 296
           C 590 320, 610 380, 600 430
           C 592 480, 610 520, 660 552
           L 652 560
           C 596 526, 574 480, 580 428
           C 586 380, 566 328, 520 302
           Z"
        fill="url(#sbFabricFill)" stroke="url(#sbFabricRim)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- secondary, fainter trailing fold for depth -->
  <path d="M 560 330 C 604 360, 616 410, 600 456" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- soft circular focus ring around the sitter, no reticle ticks -->
  <circle cx="422" cy="190" r="88" fill="none" stroke="#f4cf63" stroke-width="1.1" stroke-opacity="0.4"/>
  <circle cx="422" cy="190" r="3" fill="#f4cf63" opacity="0.75"/>

  <!-- aperture-blade accent, lower-left, warm and soft -->
  <g transform="translate(150 500)" opacity="0.85">
    <circle cx="0" cy="0" r="44" fill="url(#sbAccentGlow)"/>
    <g stroke="#d4af37" stroke-width="1.1" fill="none" stroke-opacity="0.45">
      <path d="M 0 -28 L 17 -7 L 7 17 L -7 17 L -17 -7 Z"/>
    </g>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d4af37" stroke-opacity="0.26" stroke-width="1"/>
  </g>

  <!-- thin full-bleed frame -->
  <rect x="46" y="46" width="708" height="508" fill="none" stroke="#d4af37" stroke-opacity="0.09" stroke-width="1"/>

  <!-- faint warm texture dots -->
  <g fill="#f4cf63">
    <circle cx="700" cy="150" r="1.7" opacity="0.24"/>
    <circle cx="110" cy="440" r="1.5" opacity="0.2"/>
    <circle cx="660" cy="120" r="1.4" opacity="0.2"/>
  </g>
</svg>
