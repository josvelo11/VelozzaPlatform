<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="qnGlow" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qnSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="qnGown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241f16"/>
      <stop offset="100%" stop-color="#0b0a08"/>
    </linearGradient>
    <linearGradient id="qnHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
    <linearGradient id="qnRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="330" rx="290" ry="250" fill="url(#qnGlow)"/>
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <g transform="translate(400 300)">
    <!-- ball-gown skirt: fitted bodice flaring into a wide bell -->
    <path d="M -30 90 C -100 130, -150 190, -158 236 C -60 250, 60 250, 158 236
             C 150 190, 100 130, 30 90 Z"
          fill="url(#qnGown)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85"/>
    <path d="M -30 90 C -100 130, -150 190, -158 236" fill="none" stroke="url(#qnRim)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- gown seam lines, subtle -->
    <g stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" fill="none">
      <path d="M -6 92 C -20 140, -30 190, -34 236"/>
      <path d="M 6 92 C 20 140, 30 190, 34 236"/>
    </g>
    <!-- bodice -->
    <path d="M -32 92 L -38 40 C -40 16, -26 -2, -2 -6 C 22 -2, 36 16, 34 40 L 30 92 Z"
          fill="url(#qnSkin)" stroke="#d4af37" stroke-width="1.7" stroke-opacity="0.9"/>
    <!-- neck -->
    <path d="M -14 -14 C -18 0, -19 12, -17 24 L 15 24 C 17 12, 16 0, 12 -14 Z"
          fill="url(#qnSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>
    <!-- face -->
    <path d="M -38 -84 C -42 -54, -35 -28, -14 -14 C -2 -6, 2 -6, 14 -14 C 35 -28, 42 -54, 38 -84
             C 35 -112, 18 -128, 0 -128 C -18 -128, -35 -112, -38 -84 Z"
          fill="url(#qnSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9"/>
    <path d="M -28 -74 Q -18 -80 -8 -76" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 8 -76 Q 18 -80 28 -74" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M -27 -64 Q -18 -59 -6 -63" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 6 -63 Q 18 -59 27 -64" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -12 -31 Q 0 -26 12 -31" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -14 -14 C -2 -6, 2 -6, 14 -14" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3"/>
    <!-- hair: updo, ready for a tiara -->
    <path d="M -42 -82 C -56 -124, -30 -162, 10 -166 C 50 -170, 76 -146, 76 -112
             C 74 -128, 68 -142, 56 -150 C 62 -134, 60 -118, 50 -108
             C 46 -128, 34 -140, 16 -142 C -4 -144, -22 -128, -30 -106
             C -26 -128, -32 -144, -42 -82 Z"
          fill="url(#qnHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -38 -80 C -52 -120, -30 -160, 10 -164 C 50 -168, 78 -144, 78 -110" stroke="#d4af37" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M -30 -94 C -38 -122, -18 -144, 12 -148" stroke="#f4cf63" stroke-width="1.6" stroke-opacity="0.7"/>
      <path d="M 42 -84 C 56 -92, 68 -104, 70 -118" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.8"/>
    </g>
    <!-- tiara -->
    <path d="M -24 -98 Q 0 -112 24 -98" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-opacity="0.9"/>
    <path d="M -10 -104 L -10 -110 M 0 -108 L 0 -116 M 10 -104 L 10 -110" stroke="#f4cf63" stroke-width="1.4" stroke-opacity="0.8"/>
    <circle cx="0" cy="-116" r="2.6" fill="#f4cf63"/>
  </g>

  <!-- sparkle cluster accent, lower-right -->
  <g transform="translate(650 470)" opacity="0.95">
    <g fill="#f4cf63">
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z"/>
    </g>
    <g fill="#f8f5ed" opacity="0.8">
      <path d="M 34 -34 L 37 -25 L 46 -22 L 37 -19 L 34 -10 L 31 -19 L 22 -22 L 31 -25 Z" transform="scale(0.6) translate(20 -14)"/>
    </g>
  </g>
  <!-- small companion sparkle near the tiara -->
  <g transform="translate(438 208)" opacity="0.8" fill="#f4cf63">
    <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z"/>
  </g>
</svg>
