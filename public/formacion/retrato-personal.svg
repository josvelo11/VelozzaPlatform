<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>
  <defs>
    <radialGradient id="rpGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rpSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="rpHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
    <linearGradient id="rpRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="310" rx="270" ry="260" fill="url(#rpGlow)"/>
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- figure: bust-crop portrait, sloped shoulders, no closed/rounded "blob" base -->
  <g transform="translate(400 340)">
    <path d="M -68 190 L -76 120 C -78 88, -66 58, -40 34 C -26 22, -12 16, 2 14
             C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 72 190 Z"
          fill="url(#rpSkin)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 2 14 C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 74 190"
          fill="none" stroke="url(#rpRim)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 -8 C -18 8, -19 22, -17 36 L 15 36 C 17 22, 16 8, 12 -8 Z"
          fill="url(#rpSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M -38 -78 C -42 -48, -35 -22, -14 -8 C -2 0, 2 0, 14 -8 C 35 -22, 42 -48, 38 -78
             C 35 -106, 18 -122, 0 -122 C -18 -122, -35 -106, -38 -78 Z"
          fill="url(#rpSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9"/>
    <path d="M -28 -68 Q -18 -74 -8 -70" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 8 -70 Q 18 -74 28 -68" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M -27 -58 Q -18 -53 -6 -57" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 6 -57 Q 18 -53 27 -58" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -12 -25 Q 0 -20 12 -25" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -14 -8 C -2 0, 2 0, 14 -8" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3"/>
    <!-- hair: sleek low bun, pulled back (fits a focused portrait-session mood) -->
    <path d="M -38 -76 C -48 -114, -28 -150, 8 -154 C 44 -158, 64 -130, 58 -96
             C 54 -110, 46 -122, 32 -128 C 38 -114, 36 -100, 26 -90
             C 24 -112, 10 -128, -10 -130 C -28 -132, -38 -98, -38 -76 Z"
          fill="url(#rpHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -38 -74 C -48 -112, -28 -148, 8 -152 C 44 -156, 62 -128, 56 -94" stroke="#d4af37" stroke-width="2.2" stroke-opacity="0.9"/>
      <path d="M -30 -88 C -38 -114, -20 -138, 6 -142" stroke="#f4cf63" stroke-width="1.4" stroke-opacity="0.6"/>
      <path d="M 38 -76 C 48 -70, 54 -60, 52 -48" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.8"/>
    </g>
    <ellipse cx="52" cy="-46" rx="15" ry="12" fill="url(#rpSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.8"/>
  </g>

  <!-- focus ring locking onto the subject, upper accent (kept from the original camera-portrait motif) -->
  <g stroke="#f4cf63" stroke-width="1.4" fill="none" opacity="0.75">
    <circle cx="400" cy="245" r="60"/>
    <line x1="400" y1="176" x2="400" y2="192"/>
    <line x1="400" y1="314" x2="400" y2="298"/>
    <line x1="331" y1="245" x2="347" y2="245"/>
    <line x1="469" y1="245" x2="453" y2="245"/>
  </g>

  <!-- lens focus-distance dial accent, lower-left -->
  <g transform="translate(140 470)" opacity="0.9">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
    <g stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6">
      <line x1="0" y1="-30" x2="0" y2="-22"/>
      <line x1="21" y1="-21" x2="15" y2="-15"/>
      <line x1="30" y1="0" x2="22" y2="0"/>
      <line x1="21" y1="21" x2="15" y2="15"/>
    </g>
    <line x1="0" y1="0" x2="-14" y2="-18" stroke="#f4cf63" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#f4cf63"/>
  </g>
</svg>
