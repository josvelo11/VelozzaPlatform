<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="glow" cx="58%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#0f0e0b"/>
    </linearGradient>
    <linearGradient id="pcHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2e10"/>
      <stop offset="100%" stop-color="#1c1a14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- soft ambient glow behind the figure -->
  <ellipse cx="470" cy="310" rx="270" ry="260" fill="url(#glow)"/>

  <!-- rule-of-thirds guide lines -->
  <g stroke="#d4af37" stroke-opacity="0.14" stroke-width="1">
    <line x1="266.7" y1="70" x2="266.7" y2="530"/>
    <line x1="533.3" y1="70" x2="533.3" y2="530"/>
    <line x1="90" y1="200" x2="710" y2="200"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>

  <!-- radiating composition guide lines toward the focal point -->
  <g stroke="#d4af37" stroke-opacity="0.20" stroke-width="1" fill="none">
    <line x1="70" y1="70" x2="430" y2="170"/>
    <line x1="730" y1="70" x2="474" y2="164"/>
    <line x1="70" y1="530" x2="410" y2="420"/>
    <line x1="730" y1="540" x2="560" y2="430"/>
  </g>

  <!-- viewfinder corner brackets -->
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 670 70 L 730 70 L 730 130"/>
    <path d="M 730 470 L 730 530 L 670 530"/>
    <path d="M 130 530 L 70 530 L 70 470"/>
  </g>

  <!-- exposure / rule-of-thirds tick marks along the frame edges -->
  <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="266.7" y1="70" x2="266.7" y2="82"/>
    <line x1="533.3" y1="70" x2="533.3" y2="82"/>
    <line x1="266.7" y1="518" x2="266.7" y2="530"/>
    <line x1="533.3" y1="518" x2="533.3" y2="530"/>
  </g>

  <!-- figure: bust-crop with sloped shoulders, real neck and elegant proportions
       (replaces the old boxy/blob silhouette — same figure system used across the catalog) -->
  <g transform="translate(468 340)">
    <path d="M -68 190 L -76 120 C -78 88, -66 58, -40 34 C -26 22, -12 16, 2 14
             C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 72 190 Z"
          fill="url(#pcSkin)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>
    <path d="M 2 14 C 22 16, 40 24, 54 40 C 74 62, 82 90, 78 122 L 74 190"
          fill="none" stroke="url(#rimLight)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 -8 C -18 8, -19 22, -17 36 L 15 36 C 17 22, 16 8, 12 -8 Z"
          fill="url(#pcSkin)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M -38 -78 C -42 -48, -35 -22, -14 -8 C -2 0, 2 0, 14 -8 C 35 -22, 42 -48, 38 -78
             C 35 -106, 18 -122, 0 -122 C -18 -122, -35 -106, -38 -78 Z"
          fill="url(#pcSkin)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9"/>
    <path d="M -28 -68 Q -18 -74 -8 -70" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 8 -70 Q 18 -74 28 -68" fill="none" stroke="#f4cf63" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M -27 -58 Q -18 -53 -6 -57" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 6 -57 Q 18 -53 27 -58" fill="none" stroke="#f8f5ed" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -12 -25 Q 0 -20 12 -25" fill="none" stroke="#f4cf63" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -14 -8 C -2 0, 2 0, 14 -8" fill="none" stroke="#f4cf63" stroke-width="1" stroke-opacity="0.3"/>
    <!-- hair: short, structured — reads confident/professional to match "poses that favor" -->
    <path d="M -36 -76 C -44 -108, -24 -136, 8 -138 C 38 -140, 54 -116, 50 -88
             C 46 -100, 38 -110, 26 -114 C 32 -102, 30 -92, 22 -84
             C 20 -102, 10 -114, -6 -114 C -22 -114, -34 -96, -36 -76 Z"
          fill="url(#pcHair)" stroke="none" opacity="0.85"/>
    <g fill="none" stroke-linecap="round">
      <path d="M -36 -74 C -44 -106, -24 -134, 8 -136 C 38 -138, 52 -114, 48 -86" stroke="#d4af37" stroke-width="2.2" stroke-opacity="0.9"/>
      <path d="M 34 -76 C 42 -70, 46 -60, 44 -50" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.75"/>
    </g>
  </g>

  <!-- autofocus reticle locking onto the subject's face -->
  <g stroke="#f4cf63" stroke-width="1.4" fill="none" opacity="0.85">
    <rect x="420" y="216" width="96" height="100" />
    <line x1="420" y1="216" x2="420" y2="230"/>
    <line x1="420" y1="216" x2="434" y2="216"/>
    <line x1="516" y1="216" x2="516" y2="230"/>
    <line x1="516" y1="216" x2="502" y2="216"/>
    <line x1="420" y1="316" x2="420" y2="302"/>
    <line x1="420" y1="316" x2="434" y2="316"/>
    <line x1="516" y1="316" x2="516" y2="302"/>
    <line x1="516" y1="316" x2="502" y2="316"/>
  </g>
  <circle cx="468" cy="266" r="3" fill="#f4cf63" opacity="0.9"/>

  <!-- abstract aperture-blade motif, lower-left accent -->
  <g transform="translate(140 470)" opacity="0.9">
    <circle cx="0" cy="0" r="46" fill="url(#apertureGlow)"/>
    <g stroke="#d4af37" stroke-width="1.2" fill="none" stroke-opacity="0.55">
      <path d="M 0 -30 L 18 -8 L 8 18 L -8 18 L -18 -8 Z"/>
      <path d="M 0 -20 L 12 -5 L 5 12 L -5 12 L -12 -5 Z"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- thin frame line, full bleed, echoing a viewfinder edge -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- exposure meter ladder, upper right -->
  <g stroke="#f8f5ed" stroke-opacity="0.32" stroke-width="1.2">
    <line x1="628" y1="150" x2="628" y2="164"/>
    <line x1="642" y1="150" x2="642" y2="164"/>
    <line x1="656" y1="146" x2="656" y2="168"/>
    <line x1="670" y1="150" x2="670" y2="164"/>
    <line x1="684" y1="150" x2="684" y2="164"/>
  </g>
  <circle cx="656" cy="157" r="2" fill="#f4cf63" opacity="0.7"/>
</svg>
