<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="spGlowA" cx="40%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.17"/>
      <stop offset="48%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spConnectGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spFigureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="spRimA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spRimB" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spApertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- ambient glow, biased toward the pair -->
  <ellipse cx="400" cy="330" rx="300" ry="270" fill="url(#spGlowA)"/>

  <!-- warm connective glow bridging the two figures -->
  <ellipse cx="418" cy="300" rx="110" ry="140" fill="url(#spConnectGlow)"/>

  <!-- rule-of-thirds guide lines -->
  <g stroke="#d4af37" stroke-opacity="0.13" stroke-width="1">
    <line x1="266.7" y1="60" x2="266.7" y2="560"/>
    <line x1="533.3" y1="60" x2="533.3" y2="560"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="400" x2="720" y2="400"/>
  </g>

  <!-- guide lines converging on the space between them -->
  <g stroke="#d4af37" stroke-opacity="0.18" stroke-width="1" fill="none">
    <line x1="80" y1="60" x2="380" y2="200"/>
    <line x1="720" y1="60" x2="452" y2="212"/>
    <line x1="80" y1="560" x2="330" y2="470"/>
    <line x1="720" y1="560" x2="470" y2="470"/>
  </g>

  <!-- viewfinder corner brackets -->
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 66 122 L 66 60 L 128 60"/>
    <path d="M 672 60 L 734 60 L 734 122"/>
    <path d="M 734 498 L 734 560 L 672 560"/>
    <path d="M 128 560 L 66 560 L 66 498"/>
  </g>

  <!-- exposure ticks -->
  <g stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="266.7" y1="60" x2="266.7" y2="72"/>
    <line x1="533.3" y1="60" x2="533.3" y2="72"/>
    <line x1="266.7" y1="548" x2="266.7" y2="560"/>
    <line x1="533.3" y1="548" x2="533.3" y2="560"/>
  </g>

  <!-- left figure: larger, nearer, turned right toward the partner -->
  <g>
    <path d="M 170 500
             Q 158 420 200 340
             Q 202 296 252 282
             L 302 270
             Q 344 264 378 274
             Q 402 282 404 324
             C 414 382, 406 472, 362 532
             Q 296 554 234 548
             Q 186 542 170 500 Z"
          fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>

    <!-- rim light on the outer/back edge, away from the partner -->
    <path d="M 170 500 Q 158 420 200 340 Q 202 296 252 282"
          fill="none" stroke="url(#spRimB)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M 292 274 L 300 238 L 338 236 L 346 270 Z" fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.75"/>

    <!-- head, tilted toward the partner -->
    <ellipse cx="330" cy="205" rx="44" ry="54" fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" transform="rotate(-8 330 205)"/>
    <path d="M 300 172 C 286 188, 286 226, 304 246" fill="none" stroke="url(#spRimB)" stroke-width="2.4" stroke-linecap="round" transform="rotate(-8 330 205)"/>
  </g>

  <!-- right figure: smaller, set back, turned left toward the partner -->
  <g>
    <path d="M 630 460
             Q 640 400 610 340
             Q 608 306 572 296
             L 534 288
             Q 500 284 474 292
             Q 456 298 454 330
             C 448 376, 454 448, 488 496
             Q 540 514 588 510
             Q 622 506 630 460 Z"
          fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85" stroke-linejoin="round"/>

    <!-- rim light on the outer/back edge, away from the partner -->
    <path d="M 630 460 Q 640 400 610 340 Q 608 306 572 296"
          fill="none" stroke="url(#spRimA)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M 480 292 L 486 262 L 518 260 L 526 290 Z" fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.3" stroke-opacity="0.7"/>

    <!-- head, tilted toward the partner -->
    <ellipse cx="505" cy="278" rx="34" ry="42" fill="url(#spFigureFill)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85" transform="rotate(8 505 278)"/>
    <path d="M 530 250 C 542 264, 542 296, 528 312" fill="none" stroke="url(#spRimA)" stroke-width="2" stroke-linecap="round" transform="rotate(8 505 278)"/>
  </g>

  <!-- soft focal point marking the space held between them -->
  <circle cx="418" cy="292" r="3" fill="#f4cf63" opacity="0.8"/>
  <g stroke="#f4cf63" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <circle cx="418" cy="292" r="20"/>
  </g>

  <!-- aperture-blade accent, lower-left -->
  <g transform="translate(140 500)" opacity="0.9">
    <circle cx="0" cy="0" r="42" fill="url(#spApertureGlow)"/>
    <g stroke="#d4af37" stroke-width="1.2" fill="none" stroke-opacity="0.55">
      <path d="M 0 -26 L 16 -7 L 7 16 L -7 16 L -16 -7 Z"/>
      <path d="M 0 -18 L 11 -4 L 4 11 L -4 11 L -11 -4 Z"/>
    </g>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- thin full-bleed frame -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- faint texture dots -->
  <g fill="#f4cf63">
    <circle cx="700" cy="120" r="1.6" opacity="0.24"/>
    <circle cx="120" cy="200" r="1.5" opacity="0.22"/>
    <circle cx="690" cy="480" r="1.7" opacity="0.2"/>
  </g>
</svg>
