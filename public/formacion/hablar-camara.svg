<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="hcGlow" cx="68%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcFigureFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="hcRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4cf63" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="hcIris" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f4cf63" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0b0b"/>

  <!-- ambient glow behind the lens -->
  <ellipse cx="560" cy="290" rx="260" ry="250" fill="url(#hcGlow)"/>

  <!-- faint scattered texture dots -->
  <g fill="#f4cf63">
    <circle cx="100" cy="80" r="1.8" opacity="0.3"/>
    <circle cx="740" cy="500" r="2" opacity="0.25"/>
    <circle cx="70" cy="470" r="1.6" opacity="0.28"/>
    <circle cx="660" cy="90" r="1.6" opacity="0.25"/>
    <circle cx="120" cy="260" r="1.4" opacity="0.2"/>
  </g>

  <!-- thin full-bleed frame, echoing a viewfinder edge -->
  <rect x="42" y="42" width="716" height="516" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1"/>

  <!-- radiating light spokes from the lens -->
  <g stroke="#d4af37" fill="none">
    <line x1="560" y1="290" x2="560" y2="60" stroke-width="1.4" opacity="0.18"/>
    <line x1="560" y1="290" x2="700" y2="110" stroke-width="1.4" opacity="0.24"/>
    <line x1="560" y1="290" x2="760" y2="230" stroke-width="1.6" opacity="0.3"/>
    <line x1="560" y1="290" x2="770" y2="340" stroke-width="1.6" opacity="0.28"/>
    <line x1="560" y1="290" x2="720" y2="470" stroke-width="1.4" opacity="0.22"/>
    <line x1="560" y1="290" x2="600" y2="540" stroke-width="1.2" opacity="0.16"/>
  </g>

  <!-- camera lens: concentric iris rings -->
  <g>
    <circle cx="560" cy="290" r="96" fill="url(#hcIris)"/>
    <circle cx="560" cy="290" r="96" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55"/>
    <circle cx="560" cy="290" r="74" fill="none" stroke="#d4af37" stroke-width="1.6" opacity="0.4"/>
    <circle cx="560" cy="290" r="52" fill="none" stroke="#f4cf63" stroke-width="1.6" opacity="0.6"/>
    <!-- abstract aperture blades -->
    <g stroke="#d4af37" stroke-width="1.2" fill="none" stroke-opacity="0.65" stroke-linejoin="round">
      <path d="M 560 253 L 590 272 L 578 306 L 542 306 L 530 272 Z"/>
    </g>
    <circle cx="560" cy="290" r="14" fill="#0b0b0b" stroke="#f4cf63" stroke-width="1.4" opacity="0.85"/>
    <!-- glint -->
    <circle cx="538" cy="266" r="5" fill="#f8f5ed" opacity="0.8"/>
  </g>

  <!-- voice arcs near the speaker's head, opening toward the lens -->
  <g fill="none" stroke="#f4cf63">
    <path d="M 315 245 A 42 42 0 0 1 315 305" stroke-width="2.2" opacity="0.55"/>
    <path d="M 340 222 A 78 78 0 0 1 340 328" stroke-width="1.8" opacity="0.35"/>
    <path d="M 365 200 A 114 114 0 0 1 365 350" stroke-width="1.4" opacity="0.18"/>
  </g>

  <!-- speaker silhouette: head, neck, shoulders, one hand mid-gesture toward the lens -->
  <g>
    <!-- shoulders / torso -->
    <path d="M 128 560
             L 140 430
             Q 146 392 182 380
             L 236 366
             Q 258 360 268 340
             L 278 300
             L 296 300
             L 300 350
             Q 302 372 320 384
             L 356 402
             Q 380 414 384 442
             L 392 560
             Z"
          fill="url(#hcFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.85" stroke-linejoin="round"/>

    <!-- rim light along the near edge -->
    <path d="M 268 340 L 278 300 L 296 300 L 300 350 Q 302 372 320 384 L 356 402 Q 380 414 384 442 L 392 560"
          fill="none" stroke="url(#hcRim)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M 250 300 L 254 268 L 284 266 L 290 300 Z" fill="url(#hcFigureFill)" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.75"/>

    <!-- head, tilted toward the lens -->
    <ellipse cx="278" cy="222" rx="44" ry="54" fill="url(#hcFigureFill)" stroke="#d4af37" stroke-width="1.8" stroke-opacity="0.9" transform="rotate(8 278 222)"/>
    <path d="M 304 190 C 318 204 320 244 302 262" fill="none" stroke="url(#hcRim)" stroke-width="2.2" stroke-linecap="round" transform="rotate(8 278 222)"/>

    <!-- raised arm gesturing toward the lens: a tapered sleeve as a closed, filled shape -->
    <path d="M 352 390
             Q 400 382 438 350
             Q 458 332 480 328
             Q 486 336 482 344
             Q 462 350 444 366
             Q 408 398 362 410
             Z"
          fill="url(#hcFigureFill)" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.85" stroke-linejoin="round"/>
    <path d="M 438 350 Q 458 332 480 328" fill="none" stroke="url(#hcRim)" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>

    <!-- open hand, abstracted as a soft rounded mark -->
    <ellipse cx="490" cy="334" rx="13" ry="9" fill="url(#hcFigureFill)" stroke="#f4cf63" stroke-width="1.5" opacity="0.9" transform="rotate(-18 490 334)"/>
  </g>

  <!-- minimal voice-rhythm accent, lower left -->
  <g fill="#d4af37" opacity="0.6">
    <rect x="100" y="512" width="6" height="20" rx="2.5" opacity="0.5"/>
    <rect x="112" y="498" width="6" height="34" rx="2.5" opacity="0.7"/>
    <rect x="124" y="506" width="6" height="26" rx="2.5" opacity="0.55"/>
    <rect x="136" y="488" width="6" height="44" rx="2.5" opacity="0.85"/>
  </g>

  <!-- thin baseline -->
  <line x1="90" y1="560" x2="392" y2="560" stroke="#d4af37" stroke-width="1" opacity="0.18"/>
</svg>
